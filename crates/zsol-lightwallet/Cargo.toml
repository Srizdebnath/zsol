[package]
name = "zsol-lightwallet"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
zsol-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

age = { version = "0.12", features = ["armor"] }
bip0039 = { version = "0.14", features = ["std"] }
secrecy = "0.8"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tonic = { version = "0.14", features = ["gzip", "tls-webpki-roots"] }
uuid = { version = "1", features = ["serde"] }
ed25519-dalek = "2"
getrandom = "0.3"

orchard = { version = "0.16", default-features = false }
zcash_address = "=0.14.0-pre.2"
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "sync", "unstable"] }
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["unstable", "orchard"] }
zcash_keys = { version = "=0.17.0-pre.2", features = ["orchard", "sapling", "unstable"] }
zcash_primitives = "=0.31.0-pre.2"
zcash_proofs = { version = "=0.31.0-pre.2", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0-pre.1"
zip321 = "=0.10.0-pre.2"
zip32 = "0.3"
